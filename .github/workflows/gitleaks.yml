name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks v8.30.1 (pinned binary, sha256 verified)
        run: |
          # Pinned release download instead of a package-manager install: the
          # asset URL and its sha256 were verified locally against the
          # release's own checksums.txt and the GitHub API asset listing
          # (size 8230402 bytes, digest matches both sources).
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" \
            | sha256sum --check --strict -
          tar -xzf gitleaks.tar.gz
          mkdir -p "$HOME/.local/bin"
          mv gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: scan full history
        run: gitleaks git . --redact --no-banner --exit-code 1
