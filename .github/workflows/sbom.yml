name: SBOM

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cyclonedx:
    name: cyclonedx-1.6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: generate SBOM (fails closed on invalid output)
        run: node ci/sbom.mjs --out sbom.cdx.json --tool-version "${GITHUB_SHA::12}"
      - name: show component count
        run: node -e "const b=require('./sbom.cdx.json'); console.log(b.bomFormat, b.specVersion, b.components.length+' components')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
