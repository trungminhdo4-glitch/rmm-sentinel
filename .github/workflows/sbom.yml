name: SBOM

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cyclonedx:
    name: cyclonedx-1.6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: generate SBOM (fails closed on invalid output)
        run: node ci/sbom.mjs --out sbom.cdx.json --tool-version "${GITHUB_SHA::12}"
      - name: show component count
        run: node -e "const b=require('./sbom.cdx.json'); console.log(b.bomFormat, b.specVersion, b.components.length+' components')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
