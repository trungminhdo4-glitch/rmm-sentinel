name: Bug report
description: RMM-Sentinel misbehaved - wrong findings, crash, or unexpected behaviour
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security-relevant reports must not use this form.**
        Use [GitHub Security Advisories](https://github.com/trungminhdo4-glitch/rmm-sentinel/security/advisories/new)
        instead (see [SECURITY.md](../blob/main/SECURITY.md)).
  - type: input
    id: version
    attributes:
      label: RMM-Sentinel version
      description: Output of `node rmm-sentinel.mjs version`
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Scanned host context
      description: Windows version and rough context (workstation, server, MSP-managed?) - never paste hostnames, users, or real internal names
      placeholder: "Windows 11 23H2, non-managed workstation"
    validations:
      required: false
  - type: textarea
    id: command
    attributes:
      label: Command line
      description: The exact command you ran (no tokens or private host names you cannot share)
      placeholder: "node rmm-sentinel.mjs scan --format json"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Output, exit code, and whether it is reproducible (redact internal paths if needed)
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, installation method
      placeholder: "Windows 11, node 24.x, cloned from source"
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This is not a security vulnerability (those go through Security Advisories)
          required: true
        - label: I have searched existing issues for duplicates
          required: true
        - label: The behaviour respects the disclaimer in the README (signal findings need manual review)
          required: false
